name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build python3 pkg-config zip \
            libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libfreetype-dev libharfbuzz-dev libgl-dev libvulkan-dev

      - name: Configure
        run: cmake -S vidra -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build --parallel 2 --target vidra test_color test_spring test_sdf test_json test_runtime test_editor test_window test_renderer test_settings

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Assemble Linux x86_64 packages
        run: |
          mkdir -p dist/vidra
          cp build/vidra dist/vidra/vidra
          cp -R vidra/shaders dist/vidra/shaders
          cp LICENSE dist/vidra/LICENSE
          cp vidra/README.md dist/vidra/README.md
          cat > dist/vidra/run.sh <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")"
          exec ./vidra "$@"
          EOF
          chmod +x dist/vidra/run.sh
          tar -C dist -czf dist/vidra-linux-x86_64.tar.gz vidra
          (cd dist && zip -qr vidra-linux-x86_64.zip vidra)

      - name: Upload build packages
        uses: actions/upload-artifact@v4
        with:
          name: vidra-linux-x86_64
          path: |
            dist/vidra-linux-x86_64.tar.gz
            dist/vidra-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vidra-linux-x86_64.tar.gz
            dist/vidra-linux-x86_64.zip
